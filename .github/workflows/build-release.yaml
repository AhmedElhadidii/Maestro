name: Build and Release Maestro CLI

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0-custom)'
        required: false
        default: ''
  # On push to main or tags
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Maestro CLI (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Node.js (for maestro-studio-web)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Maestro CLI distribution
        run: ./gradlew --no-daemon :maestro-cli:distZip :maestro-cli:distTar

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep "CLI_VERSION=" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Built version: $VERSION"

      - name: Rename artifacts with version
        run: |
          cd maestro-cli/build/distributions
          mv maestro.zip maestro-${{ steps.get_version.outputs.version }}-linux-x64.zip
          mv maestro.tar maestro-${{ steps.get_version.outputs.version }}-linux-x64.tar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maestro-cli-linux-x64
          path: |
            maestro-cli/build/distributions/maestro-*.zip
            maestro-cli/build/distributions/maestro-*.tar
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Only create release on tags or manual trigger with release_tag
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: maestro-cli-linux-x64
          path: ./artifacts

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event.inputs.release_tag }}" != "" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Maestro CLI ${{ steps.release_tag.outputs.tag }}
          body: |
            ## Maestro CLI Release ${{ steps.release_tag.outputs.tag }}
            
            ### Downloads
            - `maestro-*-linux-x64.zip` - Maestro CLI distribution for Linux x64
            - `maestro-*-linux-x64.tar` - Maestro CLI distribution for Linux x64 (tar format)
            
            ### Installation
            ```bash
            # Download and extract
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}/maestro-<VERSION>-linux-x64.zip
            unzip maestro-*-linux-x64.zip -d /opt
            export PATH="/opt/maestro/bin:$PATH"
            
            # Verify
            maestro --version
            ```
            
            ### Docker Usage
            ```dockerfile
            FROM eclipse-temurin:17-jre
            
            # Download and install Maestro
            ARG MAESTRO_VERSION=latest
            RUN apt-get update && apt-get install -y wget unzip && \
                wget -O /tmp/maestro.zip https://github.com/${{ github.repository }}/releases/download/${MAESTRO_VERSION}/maestro-*-linux-x64.zip && \
                unzip /tmp/maestro.zip -d /opt && \
                rm /tmp/maestro.zip && \
                apt-get clean
            
            ENV PATH="/opt/maestro/bin:${PATH}"
            ```
          files: |
            ./artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Latest build - always updates on main branch
  update-latest:
    name: Update Latest Build
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: maestro-cli-linux-x64
          path: ./artifacts

      - name: Rename to latest
        run: |
          cd artifacts
          for f in maestro-*.zip; do cp "$f" maestro-latest-linux-x64.zip; done
          for f in maestro-*.tar; do cp "$f" maestro-latest-linux-x64.tar; done

      - name: Update latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: |
            ## Latest Maestro CLI Build
            
            **Auto-updated from main branch**
            
            Built from commit: ${{ github.sha }}
            
            ### Quick Download (for Dockerfile)
            ```bash
            # Download latest
            curl -L -o maestro.zip https://github.com/${{ github.repository }}/releases/download/latest/maestro-latest-linux-x64.zip
            
            # Or in Dockerfile
            ADD https://github.com/${{ github.repository }}/releases/download/latest/maestro-latest-linux-x64.zip /tmp/maestro.zip
            RUN unzip /tmp/maestro.zip -d /opt && rm /tmp/maestro.zip
            ENV PATH="/opt/maestro/bin:${PATH}"
            ```
          files: |
            ./artifacts/maestro-latest-*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
