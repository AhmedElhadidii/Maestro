name: Build and Release Maestro CLI

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0-custom). Leave empty for auto-increment.'
        required: false
        default: ''
  # On push to main
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'

env:
  # Base version - increment this for major/minor releases
  BASE_VERSION: "1.0.0"

jobs:
  build:
    name: Build Maestro CLI (Linux x64)
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tag counting

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Node.js (for maestro-studio-web)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'maestro-studio/web/package-lock.json'

      - name: Calculate version
        id: version
        run: |
          # Count commits since last tag or use run number
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo ${{ github.run_number }})
          
          # Check if manual tag was provided
          if [ "${{ github.event.inputs.release_tag }}" != "" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            # Auto-generate tag: v{BASE_VERSION}-build.{count}
            TAG="v${{ env.BASE_VERSION }}-build.${COMMIT_COUNT}"
          fi
          
          VERSION="${TAG#v}"  # Remove 'v' prefix for version
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION (Tag: $TAG)"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean node_modules (fix cross-platform symlinks)
        run: |
          # Remove any existing node_modules to avoid Mac -> Linux issues
          rm -rf maestro-studio/web/node_modules || true

      - name: Cache Gradle build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
            */build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Maestro CLI distribution
        run: ./gradlew --no-daemon --build-cache :maestro-cli:distZip :maestro-cli:distTar

      - name: Rename artifacts with version
        run: |
          cd maestro-cli/build/distributions
          mv maestro.zip maestro-${{ steps.version.outputs.version }}-linux-x64.zip
          mv maestro.tar maestro-${{ steps.version.outputs.version }}-linux-x64.tar
          echo "📦 Created artifacts:"
          ls -la

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maestro-cli-linux-x64
          path: |
            maestro-cli/build/distributions/maestro-*.zip
            maestro-cli/build/distributions/maestro-*.tar
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: maestro-cli-linux-x64
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Copy to latest naming
        run: |
          cd artifacts
          # Also create 'latest' named files for easy download
          for f in maestro-*.zip; do cp "$f" maestro-latest-linux-x64.zip; done
          for f in maestro-*.tar; do cp "$f" maestro-latest-linux-x64.tar; done
          ls -la

      - name: Create/Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Maestro CLI ${{ needs.build.outputs.tag }}
          body: |
            ## Maestro CLI Release ${{ needs.build.outputs.tag }}
            
            **Built from:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            ### 📥 Downloads
            
            | File | Description |
            |------|-------------|
            | `maestro-${{ needs.build.outputs.version }}-linux-x64.zip` | Versioned zip |
            | `maestro-${{ needs.build.outputs.version }}-linux-x64.tar` | Versioned tar |
            | `maestro-latest-linux-x64.zip` | Latest (always updated) |
            
            ### 🐳 Docker Usage
            
            ```dockerfile
            FROM eclipse-temurin:17-jre
            
            # Download Maestro CLI
            ADD https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag }}/maestro-latest-linux-x64.zip /tmp/maestro.zip
            RUN apt-get update && apt-get install -y unzip && \
                unzip /tmp/maestro.zip -d /opt && \
                rm /tmp/maestro.zip && \
                apt-get clean
            
            ENV PATH="/opt/maestro/bin:${PATH}"
            
            # Start MCP server
            CMD ["maestro", "mcp", "--http", "--http-port", "7090"]
            EXPOSE 7090
            ```
            
            ### 🔧 Quick Install
            
            ```bash
            curl -L -o maestro.zip https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag }}/maestro-latest-linux-x64.zip
            unzip maestro.zip -d /opt
            export PATH="/opt/maestro/bin:$PATH"
            maestro --version
            ```
          files: |
            ./artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.build.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download URL" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases/download/${{ needs.build.outputs.tag }}/maestro-latest-linux-x64.zip" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
